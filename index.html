<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFS Navigator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f2f4f7;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 22px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 6px 0 0;
  opacity: .8;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  margin-top: 8px;
  cursor: pointer;
}

.primary {
  background: #2563eb;
  color: white;
}

.green {
  background: #16a34a;
  color: white;
}

.dark {
  background: #111827;
  color: white;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  margin-top: 7px;
  font-size: 16px;
}

label {
  display: block;
  margin-top: 10px;
  font-weight: 600;
}

.pfs {
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 14px;
  margin-top: 12px;
}

.pfs h3 {
  margin: 0 0 5px;
}

.distance {
  color: #2563eb;
  font-weight: 700;
}

.actions {
  display: flex;
  gap: 8px;
}

.actions button {
  flex: 1;
}

.small {
  font-size: 13px;
  color: #6b7280;
}

#status {
  margin-top: 10px;
  font-weight: 600;
}

#results {
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <h1>📍 PFS Navigator</h1>
  <p>Trova il PFS più vicino</p>
</header>

<div class="container">

  <div class="card">

    <button class="primary" onclick="getLocation()">
      📍 Usa la mia posizione
    </button>

    <div id="status"></div>

  </div>

  <div class="card">

    <h2>🔎 Cerca PFS</h2>

    <input
      id="search"
      type="text"
      placeholder="Codice PFS o comune..."
      oninput="showPFS()"
    >

  </div>

  <div class="card">

    <h2>➕ Aggiungi PFS</h2>

    <label>Codice PFS</label>
    <input id="pfsCode" placeholder="Es. NA/10/02E22">

    <label>Comune</label>
    <input id="pfsCity" placeholder="Es. Caserta">

    <label>Latitudine</label>
    <input id="pfsLat" type="number" step="any" placeholder="Es. 41.073">

    <label>Longitudine</label>
    <input id="pfsLng" type="number" step="any" placeholder="Es. 14.334">

    <button class="green" onclick="addPFS()">
      Salva PFS
    </button>

  </div>

  <div class="card">

    <h2>📡 PFS disponibili</h2>

    <div id="results"></div>

  </div>

</div>

<script>

let userLat = null;
let userLng = null;


/* =========================
   DATI PFS
========================= */

let pfsList = JSON.parse(
  localStorage.getItem("pfsList") || "[]"
);


/* =========================
   POSIZIONE
========================= */

function getLocation() {

  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.innerHTML = "❌ GPS non disponibile";
    return;
  }

  status.innerHTML = "📡 Ricerca posizione...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      userLat = position.coords.latitude;
      userLng = position.coords.longitude;

      status.innerHTML =
        "✅ Posizione trovata";

      showPFS();

    },

    function(error) {

      status.innerHTML =
        "❌ Impossibile ottenere la posizione. Controlla i permessi GPS.";

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );
}


/* =========================
   DISTANZA
========================= */

function distance(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const dLat =
    (lat2 - lat1) * Math.PI / 180;

  const dLon =
    (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat/2) ** 2 +
    Math.cos(lat1 * Math.PI/180) *
    Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) ** 2;

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R * c;
}


/* =========================
   VISUALIZZA PFS
========================= */

function showPFS() {
  const search = document.getElementById("search").value.trim().toLowerCase();

  const results = pfsList.filter(pfs => {
    return (
      String(pfs.code || "").toLowerCase().includes(search) ||
      String(pfs.comune || "").toLowerCase().includes(search) ||
      String(pfs.nome || "").toLowerCase().includes(search)
    );
  });

  const container = document.getElementById("results");

  if (results.length === 0) {
    container.innerHTML = "<p>Nessun PFS trovato.</p>";
    return;
  }

  container.innerHTML = results.map(pfs => `
    <div class="pfs-item">
      <strong>${pfs.code || ""}</strong>
      <div>${pfs.comune || ""}</div>
      <div>${pfs.nome || ""}</div>
    </div>
  `).join("");
}

  const container =
    document.getElementById("results");

  const search =
    document.getElementById("search").value
      .toLowerCase()
      .trim();

  let list = [...pfsList];

  if (search) {

    list = list.filter(p =>

      p.code.toLowerCase().includes(search) ||

      p.city.toLowerCase().includes(search)

    );

  }


  if (userLat !== null) {

    list.forEach(p => {

      p.distance =
        distance(
          userLat,
          userLng,
          Number(p.lat),
          Number(p.lng)
        );

    });

    list.sort((a,b) =>
      a.distance - b.distance
    );

  }


  if (list.length === 0) {

    container.innerHTML = `
      <p class="small">
        Nessun PFS trovato.
      </p>
    `;

    return;

  }


  container.innerHTML = "";


  list.forEach((p,index) => {

    let distanceText = "";

    if (p.distance !== undefined) {

      distanceText =
        `<div class="distance">
          📍 ${p.distance.toFixed(2)} km
        </div>`;

    }


    container.innerHTML += `

      <div class="pfs">

        <h3>${escapeHTML(p.code)}</h3>

        <div>
          📍 ${escapeHTML(p.city)}
        </div>

        ${distanceText}

        <div class="small">
          ${Number(p.lat).toFixed(6)},
          ${Number(p.lng).toFixed(6)}
        </div>

        <div class="actions">

          <button
            class="primary"
            onclick="googleMaps(${p.lat},${p.lng})">
            Google Maps
          </button>

          <button
            class="dark"
            onclick="appleMaps(${p.lat},${p.lng})">
            Apple Maps
          </button>

        </div>

        <button
          onclick="deletePFS(${index})">
          🗑 Elimina
        </button>

      </div>

    `;

  });

}


/* =========================
   AGGIUNGI PFS
========================= */

function addPFS() {

  const code =
    document.getElementById("pfsCode").value.trim();

  const city =
    document.getElementById("pfsCity").value.trim();

  const lat =
    document.getElementById("pfsLat").value.trim();

  const lng =
    document.getElementById("pfsLng").value.trim();


  if (!code || !city || !lat || !lng) {

    alert("Compila tutti i campi.");

    return;

  }


  pfsList.push({

    code: code,
    city: city,
    lat: Number(lat),
    lng: Number(lng)

  });


  localStorage.setItem(
    "pfsList",
    JSON.stringify(pfsList)
  );


  document.getElementById("pfsCode").value = "";
  document.getElementById("pfsCity").value = "";
  document.getElementById("pfsLat").value = "";
  document.getElementById("pfsLng").value = "";


  showPFS();

  alert("✅ PFS salvato");

}


/* =========================
   ELIMINA PFS
========================= */

function deletePFS(index) {

  if (!confirm("Vuoi eliminare questo PFS?")) {
    return;
  }

  pfsList.splice(index,1);

  localStorage.setItem(
    "pfsList",
    JSON.stringify(pfsList)
  );

  showPFS();

}


/* =========================
   GOOGLE MAPS
========================= */

function googleMaps(lat,lng) {

  const url =
    "https://www.google.com/maps/dir/?api=1&destination="
    + lat + "," + lng;

  window.open(url,"_blank");

}


/* =========================
   APPLE MAPS
========================= */

function appleMaps(lat,lng) {

  const url =
    "https://maps.apple.com/?daddr="
    + lat + "," + lng;

  window.open(url,"_blank");

}


/* =========================
   SICUREZZA TESTO
========================= */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   AVVIO
========================= */

showPFS();

</script>

</body>
</html>
