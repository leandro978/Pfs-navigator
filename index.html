<title>PFS Navigator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f4f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:34px 18px 50px}
h1{margin:0;text-align:center;font-size:42px;line-height:1.1}
.subtitle{text-align:center;color:#666;font-size:20px;margin:12px 0 28px}
.card{background:#fff;border-radius:28px;padding:28px 22px;box-shadow:0 8px 28px rgba(0,0,0,.07);margin-bottom:20px}
label{display:block;font-weight:700;font-size:22px;margin:0 0 10px}

.search{background:#087ff5;color:white}
.clear{background:#e5e5e9;color:#222;margin-top:14px}
.status{background:#fff;border-radius:28px;padding:24px 20px;text-align:center;font-size:22px;color:#666;box-shadow:0 8px 28px rgba(0,0,0,.06)}
.results{margin-top:20px}
.result{background:#fff;border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:0 5px 18px rgba(0,0,0,.06)}
.code{font-size:22px;font-weight:800;margin-bottom:7px}
.meta{color:#666;font-size:16px;margin-bottom:14px}
.map{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#087ff5;color:#fff;border-radius:15px;padding:13px 18px;font-size:17px;font-weight:700}
.count{font-weight:700;color:#222}
.small{font-size:15px;color:#777;margin-top:14px;text-align:center}

</style>
</head>
<body>
<main>
  <h1>📍 PFS Navigator</h1>

  <div id="results" class="results"></div>
</main>

const comune = document.getElementById("comune");
const codice = document.getElementById("codice");
const statusBox = document.getElementById("status");
const results = document.getElementById("results");

const comuni = Object.keys(DATA).sort((a,b)=>a.localeCompare(b,'it'));
comuni.forEach(c=>{
  const o=document.createElement("option");
  o.value=c; o.textContent=c;
  comune.appendChild(o);
});

function norm(v){
  return String(v ?? "")
    .normalize("NFD")
    .replace(/[\\u0300-\\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]/g,"");
}

function cerca(){
  const selected = comune.value;
  const q = codice.value.trim();

  // If the user types a municipality name in the code field, treat it as a municipality search.
  let selectedComune = selected;
  if(!selectedComune && q){
    const nq = norm(q);
    const found = comuni.find(c => norm(c) === nq || norm(c).includes(nq));
    if(found) selectedComune = found;
  }

  let pool = [];
  if(selectedComune){
    pool = DATA[selectedComune].map(x=>({...x, comune:selectedComune}));
  } else {
    comuni.forEach(c => DATA[c].forEach(x=>pool.push({...x, comune:c})));
  }

  // If the text matches a municipality, don't filter the PFS codes by that same text.
  const isComuneQuery = q && comuni.some(c => norm(c) === norm(q) || norm(c).includes(norm(q)));
  if(q && !isComuneQuery){
    const nq = norm(q);
    pool = pool.filter(x => norm(x.code).includes(nq) || norm(x.comune).includes(nq));
  }

  pool.sort((a,b)=>a.comune.localeCompare(b.comune,'it') || a.code.localeCompare(b.code,'it'));

  results.innerHTML = "";
  if(!pool.length){
    statusBox.innerHTML = '❌ <span>Nessun PFS trovato</span>';
    return;
  }

  statusBox.innerHTML = '📍 <span class="count">'+pool.length+'</span> PFS trovati';

  pool.forEach(x=>{
    const div=document.createElement("div");
    div.className="result";
    const maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(x.lat+","+x.lon);
    div.innerHTML =
      '<div class="code">'+escapeHtml(x.code)+'</div>'+
      '<div class="meta">'+escapeHtml(x.comune)+' · '+x.lat.toFixed(6)+', '+x.lon.toFixed(6)+'</div>'+
      '<a class="map" target="_blank" rel="noopener" href="'+maps+'">🧭 Apri Maps</a>';
    results.appendChild(div);
  });
}

function azzera(){
  comune.value="";
  codice.value="";
  results.innerHTML="";
  statusBox.innerHTML="Seleziona un comune o inserisci un codice PFS.";
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

codice.addEventListener("keydown",e=>{
  if(e.key==="Enter") cerca();
});
</script>
