<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PFS Navigator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f2f4f7;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 22px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 6px 0 0;
  opacity: .8;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  margin-top: 8px;
  cursor: pointer;
}

.primary {
  background: #2563eb;
  color: white;
}

.green {
  background: #16a34a;
  color: white;
}

.dark {
  background: #111827;
  color: white;
}

.red {
  background: #dc2626;
  color: white;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  margin-top: 7px;
  font-size: 16px;
}

label {
  display: block;
  margin-top: 10px;
  font-weight: 600;
}

.pfs {
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 14px;
  margin-top: 12px;
}

.pfs h3 {
  margin: 0 0 8px;
}

.distance {
  color: #2563eb;
  font-weight: 700;
  margin-top: 6px;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.actions button {
  flex: 1;
}

.small {
  font-size: 13px;
  color: #6b7280;
  margin-top: 6px;
}

#status {
  margin-top: 10px;
  font-weight: 600;
}

#results {
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <h1>📍 PFS Navigator</h1>
  <p>Trova il PFS più vicino</p>
</header>

<div class="container">

  <div class="card">

    <button class="primary" onclick="getLocation()">
      📍 Usa la mia posizione
    </button>

    <div id="status"></div>

  </div>


  <div class="card">

    <h2>🔎 Cerca PFS</h2>

    <input
      id="search"
      type="text"
      placeholder="Cerca per codice PFS o Comune..."
      oninput="showPFS()"
    >

  </div>


  <div class="card">

    <h2>➕ Aggiungi PFS</h2>

    <label>Codice PFS</label>

    <input
      id="pfsCode"
      placeholder="Es. NA/10/02E22"
    >

    <label>Comune</label>

    <input
      id="pfsCity"
      placeholder="Es. Casalnuovo"
    >

    <label>Latitudine</label>

    <input
      id="pfsLat"
      type="number"
      step="any"
      placeholder="Es. 41.073"
    >

    <label>Longitudine</label>

    <input
      id="pfsLng"
      type="number"
      step="any"
      placeholder="Es. 14.334"
    >

    <button class="green" onclick="addPFS()">
      Salva PFS
    </button>

  </div>


  <div class="card">

    <h2>📡 PFS disponibili</h2>

    <div id="results"></div>

  </div>

</div>


<script>

let userLat = null;
let userLng = null;


/* =========================
   DATI PFS
========================= */

let pfsList = JSON.parse(
  localStorage.getItem("pfsList") || "[]"
);


/* =========================
   NORMALIZZA TESTO
   Permette di cercare:
   Casalnuovo
   casalnuovo
   CASALNUOVO
   Casalnuòvo
========================= */

function normalizeText(text) {

  return String(text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();

}


/* =========================
   POSIZIONE
========================= */

function getLocation() {

  const status =
    document.getElementById("status");

  if (!navigator.geolocation) {

    status.innerHTML =
      "❌ GPS non disponibile";

    return;
  }

  status.innerHTML =
    "📡 Ricerca posizione...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      userLat =
        position.coords.latitude;

      userLng =
        position.coords.longitude;

      status.innerHTML =
        "✅ Posizione trovata";

      showPFS();

    },

    function() {

      status.innerHTML =
        "❌ Impossibile ottenere la posizione. Controlla i permessi GPS.";

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );

}


/* =========================
   DISTANZA
========================= */

function distance(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const dLat =
    (lat2 - lat1) * Math.PI / 180;

  const dLon =
    (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}


/* =========================
   VISUALIZZA PFS
========================= */

function showPFS() {

  const container =
    document.getElementById("results");

  const search =
    normalizeText(
      document.getElementById("search").value
    );


  /*
     Supporta sia i vecchi PFS salvati
     con "city" sia quelli con "comune".
  */

  let list = pfsList.filter(function(p) {

    const code =
      normalizeText(p.code);

    const comune =
      normalizeText(
        p.comune || p.city
      );

    const nome =
      normalizeText(p.nome);

    return (
      code.includes(search) ||
      comune.includes(search) ||
      nome.includes(search)
    );

  });


  /* =========================
     CALCOLO DISTANZA
  ========================= */

  list.forEach(function(p) {

    if (
      userLat !== null &&
      p.lat !== undefined &&
      p.lng !== undefined
    ) {

      p.distance =
        distance(
          userLat,
          userLng,
          Number(p.lat),
          Number(p.lng)
        );

    } else {

      p.distance = undefined;

    }

  });


  /* =========================
     ORDINA PER DISTANZA
  ========================= */

  if (userLat !== null) {

    list.sort(function(a, b) {

      return (
        (a.distance ?? Infinity) -
        (b.distance ?? Infinity)
      );

    });

  }


  /* =========================
     NESSUN RISULTATO
  ========================= */

  if (list.length === 0) {

    container.innerHTML = `
      <p class="small">
        Nessun PFS trovato.
      </p>
    `;

    return;

  }


  /* =========================
     MOSTRA RISULTATI
  ========================= */

  container.innerHTML = "";


  list.forEach(function(p) {

    const codice =
      p.code || "";

    const comune =
      p.comune || p.city || "";

    const nome =
      p.nome || "";


    let distanceText = "";


    if (p.distance !== undefined) {

      distanceText = `
        <div class="distance">
          📍 ${p.distance.toFixed(2)} km
        </div>
      `;

    }


    let coordinate = "";


    if (
      p.lat !== undefined &&
      p.lng !== undefined
    ) {

      coordinate = `
        <div class="small">
          ${Number(p.lat).toFixed(6)},
          ${Number(p.lng).toFixed(6)}
        </div>
      `;

    }


    const div =
      document.createElement("div");

    div.className = "pfs";


    div.innerHTML = `

      <h3>
        📡 ${escapeHTML(codice)}
      </h3>

      <div>
        📍 <strong>Comune:</strong>
        ${escapeHTML(comune)}
      </div>

      ${
        nome
          ? `<div>
               <strong>Nome:</strong>
               ${escapeHTML(nome)}
             </div>`
          : ""
      }

      ${distanceText}

      ${coordinate}

      <div class="actions">

        <button
          class="primary"
          onclick="googleMaps(
            ${Number(p.lat)},
            ${Number(p.lng)}
          )">

          Google Maps

        </button>


        <button
          class="dark"
          onclick="appleMaps(
            ${Number(p.lat)},
            ${Number(p.lng)}
          )">

          Apple Maps

        </button>

      </div>

      <button
        class="red"
        onclick="deletePFSByObject(this)">

        🗑 Elimina

      </button>

    `;


    /*
       Salviamo il riferimento al PFS
       per eliminare quello corretto
       anche dopo una ricerca.
    */

    div.dataset.code = codice;
    div.dataset.city = comune;

    div._pfsObject = p;


    container.appendChild(div);

  });

}


/* =========================
   AGGIUNGI PFS
========================= */

function addPFS() {

  const code =
    document.getElementById("pfsCode")
      .value
      .trim();

  const city =
    document.getElementById("pfsCity")
      .value
      .trim();

  const lat =
    document.getElementById("pfsLat")
      .value
      .trim();

  const lng =
    document.getElementById("pfsLng")
      .value
      .trim();


  if (
    !code ||
    !city ||
    !lat ||
    !lng
  ) {

    alert(
      "Compila tutti i campi."
    );

    return;

  }


  pfsList.push({

    code: code,

    city: city,

    lat: Number(lat),

    lng: Number(lng)

  });


  localStorage.setItem(
    "pfsList",
    JSON.stringify(pfsList)
  );


  document.getElementById(
    "pfsCode"
  ).value = "";

  document.getElementById(
    "pfsCity"
  ).value = "";

  document.getElementById(
    "pfsLat"
  ).value = "";

  document.getElementById(
    "pfsLng"
  ).value = "";


  showPFS();


  alert(
    "✅ PFS salvato"
  );

}


/* =========================
   ELIMINA PFS
========================= */

function deletePFSByObject(button) {

  const card =
    button.parentElement;

  const pfsObject =
    card._pfsObject;


  if (
    !confirm(
      "Vuoi eliminare questo PFS?"
    )
  ) {

    return;

  }


  const index =
    pfsList.indexOf(pfsObject);


  if (index !== -1) {

    pfsList.splice(index, 1);

  }


  localStorage.setItem(
    "pfsList",
    JSON.stringify(pfsList)
  );


  showPFS();

}


/* =========================
   GOOGLE MAPS
========================= */

function googleMaps(lat, lng) {

  const url =
    "https://www.google.com/maps/dir/?api=1&destination="
    + lat
    + ","
    + lng;

  window.open(
    url,
    "_blank"
  );

}


/* =========================
   APPLE MAPS
========================= */

function appleMaps(lat, lng) {

  const url =
    "https://maps.apple.com/?daddr="
    + lat
    + ","
    + lng;

  window.open(
    url,
    "_blank"
  );

}


/* =========================
   SICUREZZA TESTO
========================= */

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   AVVIO
========================= */

showPFS();

</script>

</body>
</html>
