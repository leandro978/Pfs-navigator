<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PFS Navigator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f4f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:42px 18px 70px}
.header{text-align:center;margin-bottom:28px}
.header h1{font-size:42px;margin:0 0 8px;font-weight:800;letter-spacing:-1.5px}
.header p{margin:0;color:#707070;font-size:20px}
.card{background:#fff;border-radius:30px;padding:30px 24px;box-shadow:0 10px 35px rgba(0,0,0,.08);margin-bottom:22px}
label{display:block;font-size:20px;font-weight:700;margin:0 0 10px}
select,input{width:100%;height:62px;border:2px solid #d1d1d1;border-radius:20px;background:#fff;padding:0 18px;font-size:21px;outline:none}
input:focus,select:focus{border-color:#1683ff}
.field{margin-bottom:25px}
button{width:100%;height:64px;border:0;border-radius:20px;font-size:21px;font-weight:750;cursor:pointer}
.search{background:#087ff5;color:#fff;margin-bottom:12px}
.reset{background:#e5e5ea;color:#202124}
.status{background:#fff;border-radius:25px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.06);font-size:20px;text-align:center;color:#666}
.status.ok{color:#222}
.result{background:#fff;border-radius:24px;padding:20px;margin-top:14px;box-shadow:0 7px 22px rgba(0,0,0,.06)}
.result-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.code{font-size:22px;font-weight:800;word-break:break-word}
.town{color:#707070;font-size:16px;margin-top:4px}
.map{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#087ff5;color:white;border-radius:15px;padding:12px 15px;font-weight:700;white-space:nowrap}
.coords{font-size:14px;color:#777;margin-top:12px}
.empty{color:#e00;font-size:21px;font-weight:600}
.count{font-weight:700;color:#222}
.small{font-size:14px;color:#777;margin-top:14px;text-align:center}
@media(max-width:520px){
  main{padding:30px 16px 60px}
  .header h1{font-size:34px}
  .header p{font-size:18px}
  .card{padding:25px 18px;border-radius:26px}
  .result-top{display:block}
  .map{margin-top:14px;width:100%}
}
</style>
</head>

</main>

function normalizza(v){
  return String(v ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}

function esc(v){
  return String(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function tutti(){
  const out=[];
  for(const comune of Object.keys(PFS_DATA)){
    for(const pfs of PFS_DATA[comune]){
      out.push({...pfs,comune});
    }
  }
  return out;
}

function cerca(){
  const comuneSel=document.getElementById("comune").value;
  const q=normalizza(document.getElementById("query").value);

  let risultati=tutti();

  if(comuneSel){
    risultati=risultati.filter(x => x.comune===comuneSel);
  }

  if(q){
    risultati=risultati.filter(x =>
      normalizza(x.codice).includes(q) ||
      normalizza(x.comune).includes(q)
    );
  }

  risultati.sort((a,b)=>{
    const ca=normalizza(a.comune), cb=normalizza(b.comune);
    return ca.localeCompare(cb) || a.codice.localeCompare(b.codice);
  });

  render(risultati, q || comuneSel);
}

function render(lista, ricerca){
  const box=document.getElementById("risultati");

  if(!lista.length){
    box.className="status";
    box.innerHTML='❌ <span class="empty">Nessun PFS trovato</span>';
    return;
  }

  let html=`<div class="count">✅ ${lista.length} PFS trovati</div>`;
  for(const x of lista){
    const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.lat+","+x.lon)}`;
    html+=`
      <div class="result">
        <div class="result-top">
          <div>
            <div class="code">${esc(x.codice)}</div>
            <div class="town">${esc(x.comune)}</div>
          </div>
          <a class="map" href="${maps}" target="_blank" rel="noopener">🧭 Apri Maps</a>
        </div>
        <div class="coords">${x.lat}, ${x.lon}</div>
      </div>`;
  }

  box.className="status ok";
  box.innerHTML=html;
}

function azzera(){
  document.getElementById("comune").value="";
  document.getElementById("query").value="";
  const box=document.getElementById("risultati");
  box.className="status";
  box.innerHTML='Inserisci un comune o un codice PFS e premi <b>Cerca PFS</b>.';
}

document.getElementById("query").addEventListener("keydown",e=>{
  if(e.key==="Enter") cerca();
});
