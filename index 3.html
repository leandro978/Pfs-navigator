function normalizza(v){
  return String(v ?? "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/\s+/g,"")
    .replace(/-/g,"/")
    .trim();
}

const comuneEl=document.getElementById("comune");
const codiceEl=document.getElementById("codice");
const output=document.getElementById("output");

const comuni=[...new Set(PFS_DATA.map(x=>x.comune))].sort((a,b)=>a.localeCompare(b,"it"));
comuni.forEach(c=>{
  const o=document.createElement("option");
  o.value=c;o.textContent=c;
  comuneEl.appendChild(o);
});

function mostra(lista){
  if(!lista.length){
    output.innerHTML='<div class="card err">❌ Nessun PFS trovato</div>';
    return;
  }
  output.innerHTML='<div class="count">'+lista.length+' PFS trovato/i</div>'+lista.map(x=>`
    <div class="result">
      <div class="code">${escapeHtml(x.codice)}</div>
      <div class="meta">🏘️ ${escapeHtml(x.comune)}</div>
      <div class="meta">📍 ${x.lat ?? "-"}, ${x.lon ?? "-"}</div>
      ${x.maps ? `<a class="map" href="${x.maps}" target="_blank" rel="noopener">🧭 Apri Maps</a>` : ""}
    </div>
  `).join("");
}

function escapeHtml(v){
  return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function cerca(){
  const comune=comuneEl.value;
  const q=normalizza(codiceEl.value);

  let lista=PFS_DATA.filter(x=>{
    const okComune=!comune || x.comune===comune;
    const okCodice=!q || normalizza(x.codice).includes(q);
    return okComune && okCodice;
  });

  mostra(lista);
}

document.getElementById("cerca").addEventListener("click",cerca);
codiceEl.addEventListener("keydown",e=>{if(e.key==="Enter")cerca();});
comuneEl.addEventListener("change",()=>{
  if(codiceEl.value.trim()) cerca();
  else mostra(PFS_DATA.filter(x=>x.comune===comuneEl.value));
});
document.getElementById("azzera").addEventListener("click",()=>{
  comuneEl.value="";
  codiceEl.value="";
  output.innerHTML="";
});
</script>
