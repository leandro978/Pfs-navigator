const norm = s => String(s ?? "").normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();

const normCode = s => norm(s).replace(/[^a-z0-9]/g,"");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const comuneEl=document.getElementById("comune");
const codiceEl=document.getElementById("codice");
const out=document.getElementById("out");
const status=document.getElementById("status");

const comuni=[...new Set(records.map(r=>r.comune))].sort((a,b)=>a.localeCompare(b,"it"));
for(const c of comuni){
  const o=document.createElement("option");
  o.value=c;o.textContent=c;comuneEl.appendChild(o);
}

function mostra(list, titolo){
  if(!list.length){
    status.textContent="";
    out.innerHTML='<div class="card empty">❌ Nessun PFS trovato</div>';
    return;
  }
  status.textContent=titolo+" · "+list.length+" risultati";
  out.innerHTML=list.map(r=>{
    const maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.lat+","+r.lon);
    return `<div class="result">
      <div class="pfs">${esc(r.pfs)}</div>
      <div class="meta">📍 ${esc(r.lat)}, ${esc(r.lon)}</div>
      <div class="actions">
        <a href="${maps}" target="_blank" rel="noopener">🗺️ Maps</a>
        <button class="copy" data-pfs="${esc(r.pfs)}">Copia PFS</button>
      </div>
    </div>`;
  }).join("");

  out.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",async()=>{
    try{await navigator.clipboard.writeText(b.dataset.pfs);b.textContent="Copiato ✓";setTimeout(()=>b.textContent="Copia PFS",1200)}
    catch(e){b.textContent="Seleziona e copia";}
  }));
}

function cerca(){
  const comune=comuneEl.value;
  const q=codiceEl.value.trim();

  // Se è scelto un Comune, il Comune ha sempre priorità.
  if(comune){
    let list=records.filter(r=>r.comune===comune);
    if(q){
      const nq=normCode(q);
      list=list.filter(r=>normCode(r.pfs).includes(nq));
    }
    mostra(list,comune);
    return;
  }

  // Senza Comune, la casella cerca SOLO nei codici PFS.
  if(q){
    const nq=normCode(q);
    const list=records.filter(r=>normCode(r.pfs).includes(nq));
    mostra(list,"Ricerca PFS");
    return;
  }

  out.innerHTML='<div class="card empty">Scegli un Comune oppure inserisci un codice PFS.</div>';
  status.textContent="";
}

document.getElementById("cerca").addEventListener("click",cerca);
codiceEl.addEventListener("keydown",e=>{if(e.key==="Enter")cerca();});
comuneEl.addEventListener("change",()=>{codiceEl.value="";cerca();});

status.textContent="Pronti "+records.length+" PFS · "+comuni.length+" comuni";
</script>
</body>
</html>
